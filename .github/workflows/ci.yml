name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-backend:
    name: Lint backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if backend exists
        id: check
        run: |
          if [ -f "projeto/backend/requirements.txt" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: projeto/backend
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff (lint)
        if: steps.check.outputs.exists == 'true'
        working-directory: projeto/backend
        run: ruff check .

      - name: Skip (backend ainda não existe)
        if: steps.check.outputs.exists == 'false'
        run: echo "Nenhum requirements.txt encontrado em projeto/backend ainda — pulando lint."

  test-backend:
    name: Testes automatizados (Python)
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if tests exist
        id: check
        run: |
          if [ -f "projeto/backend/requirements.txt" ] && [ -d "projeto/backend/tests" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: projeto/backend
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        if: steps.check.outputs.exists == 'true'
        working-directory: projeto/backend
        run: pytest -v

      - name: Skip (sem testes ainda)
        if: steps.check.outputs.exists == 'false'
        run: echo "Nenhuma pasta projeto/backend/tests encontrada ainda — pulando testes."

  docker-build:
    name: Build dos containers (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build via docker compose
        working-directory: projeto
        run: docker compose build
