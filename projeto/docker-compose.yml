services:
  db:
    build:
      context: ./db
    container_name: painel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - painel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Importa os CSVs para o banco. Roda a cada `docker compose up`, mas o script só importa
  # quando as tabelas estão vazias (ou com FORCAR_IMPORTACAO=1). Os CSVs ficam em db/etl/.
  etl:
    build:
      context: ./db/etl
    container_name: painel-etl
    restart: "no"
    working_dir: /etl
    volumes:
      - ./db/etl:/etl
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FORCAR_IMPORTACAO: ${FORCAR_IMPORTACAO:-0}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - painel-net

  backend:
    build:
      context: ./backend
    container_name: painel-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      FLASK_ENV: ${FLASK_ENV}
      FLASK_APP: ${FLASK_APP}
      SECRET_KEY: ${SECRET_KEY}
      SIMILAR_LIMIT_MAX: ${SIMILAR_LIMIT_MAX:-500}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
    ports:
      - "5000:8000"
    depends_on:
      db:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    networks:
      - painel-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: painel-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - painel-net

networks:
  painel-net:
    driver: bridge

volumes:
  db_data: