server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Proxy reverso: encaminha chamadas de API pro serviço backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: qualquer rota que não seja um arquivo real
    # cai no index.html (necessário se usar react-router, por ex.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ativa gzip pros arquivos estáticos do build (js/css ficam bem menores)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache agressivo pros assets com hash no nome (padrão do Vite)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}