openapi: 3.0.3
info:
  title: API de Consulta a Servidores Públicos
  version: 1.0.0
paths:
  /api/servidores:
    get:
      summary: Busca servidores Públicos
      parameters: 
        - name: nome
          in: query
          schema: 
            type: string
        - name: cargo
          in: query
          schema: 
            type: string
        - name: uf
          in: query
          schema: 
            type: string
            minLength: 2
            maxLength: 2
        - name: orgao
          in: query
          schema: 
            type: string
        - name: similar
          in: query
          description: "Trecho do nome. Aceita % como curinga. Mínimo de 2 caracteres, sem contar o %. Resposta ordenada por similaridade."
          schema:
            type: string
        - name: limit
          in: query
          description: "Na busca por similaridade é o máximo de resultados (padrão 100, teto 500). Nas demais buscas é o tamanho da página (padrão 20)."
          schema: 
            type: integer
            default: 20
        - name: pagina
          in: query
          schema:
            type: integer
            default: 1
      responses:
          "200":
            description: Sucesso
            content:
              application/json: 
                example:
                  total: 42
                  pagina: 1
                  resultados:
                    - nome: "Miguel Casarin"
                      cargo: "Político"
                      uf: "RS"
                      orgao: "Ministério Rebolar"
          "400":
            description: Parâmetro inválido
            content:
              application/json:
                example:
                  erro: "parametro_invalido"
                  mensagem: "UF deve ter 2 letras"
          "404":
            description: Nenhum registro encontrado ou página inexistente
            content:
              application/json:
                example:
                  erro: "nao_encontrado"
                  mensagem: "Nenhum servidor encontrado para os critérios informados"
          "429":
            description: Excesso de requisições simultâneas
            content:
              application/json:
                example:
                  erro: "limite_excedido"
                  mensagem: "Muitas requisições, tente novamente em instantes"
          "504":
            description: A consulta excedeu o tempo limite do banco de dados
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    erro:
                      type: string
                      example: timeout
                    mensagem:
                      type: string
                      example: A busca demorou muito para responder. Por favor, especifique melhor os filtros.
                example:
                  erro: "timeout"
                  mensagem: "A busca demorou muito para responder. Por favor, especifique melhor os filtros."
          "500":
            description: Erro interno ao consultar o banco de dados
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    erro:
                      type: string
                      example: erro_interno
                    mensagem:
                      type: string
                      example: Erro interno ao consultar o banco
                example:
                  erro: "erro_interno"
                  mensagem: "Erro interno ao consultar o banco"